<style>
  :root{
    --navy:#0a1f3c; --navy2:#12325e; --teal:#1fb5c9; --teal-soft:#e3f6f9;
    --ink:#16202f; --muted:#5d6878; --line:#e4e8ef; --bg:#f6f8fb; --card:#fff;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font:16px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:var(--navy2);text-decoration:none} a:hover{color:var(--teal)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}

  /* ---------- Top bar ---------- */
  header{position:fixed;inset:0 0 auto 0;z-index:20;transition:.3s;background:transparent}
  header.solid{background:rgba(10,31,60,.92);backdrop-filter:blur(10px);box-shadow:0 2px 20px rgba(0,0,0,.15)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:600}
  .brand img{height:38px;background:#fff;border-radius:6px;padding:4px 8px}
  .brand .wordmark{font-weight:800;letter-spacing:.12em;border:2px solid #fff;padding:2px 10px;border-radius:4px}
  nav{display:flex;gap:26px}
  nav a{color:rgba(255,255,255,.85);font-size:.93rem;font-weight:500;position:relative}
  nav a:hover,nav a.on{color:#fff}
  nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--teal);border-radius:2px}
  .burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;
    background:radial-gradient(1200px 500px at 80% -10%,#1c4d86 0%,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);
    padding:150px 0 140px}
  .hero h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
  .hero .role{font-size:1.2rem;color:var(--teal);font-weight:600;margin-bottom:14px}
  .hero .aff{color:rgba(255,255,255,.8);margin-bottom:26px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-size:.92rem;font-weight:600;
    border:1px solid rgba(255,255,255,.3);color:#fff;transition:.2s}
  .btn:hover{background:#fff;color:var(--navy)}
  .btn.main{background:var(--teal);border-color:var(--teal);color:var(--navy)}
  .btn.main:hover{background:#fff}
  .waves{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:120px}
  .waves path{animation:drift 14s ease-in-out infinite alternate}
  .waves path:nth-child(2){animation-duration:19s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:-60px;position:relative;z-index:2}
  .stat{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(10,31,60,.08);text-align:center}
  .stat b{display:block;font-size:2rem;color:var(--navy2);line-height:1.1}
  .stat span{color:var(--muted);font-size:.88rem}

  /* ---------- Partner logos ---------- */
  .partners{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:18px;margin-top:34px}
  .partner{background:#fff;border:1px solid var(--line);border-radius:14px;height:96px;min-width:200px;padding:16px 26px;
    display:flex;align-items:center;justify-content:center;transition:.25s}
  .partner:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(10,31,60,.1)}
  .partner img{max-height:62px;max-width:200px;object-fit:contain}
  .partner .wordmark{color:var(--navy);border-color:var(--navy);font-size:.95rem}

  /* ---------- Sections ---------- */
  section{padding:80px 0 20px}
  .kicker{color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem}
  h2{font-size:1.9rem;margin:4px 0 26px;letter-spacing:-.01em}
  h3{font-size:1.05rem;margin:34px 0 14px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:28px;box-shadow:0 4px 18px rgba(10,31,60,.05);border:1px solid var(--line)}
  .about{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
  .about p{margin:0 0 12px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{background:var(--teal-soft);color:#0b6673;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:500}
  .teams li{margin-bottom:8px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .student{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:.25s;border-top:3px solid var(--teal)}
  .student:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(10,31,60,.1)}
  .student .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .student b{font-size:1.02rem}
  .badge{font-size:.75rem;background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;white-space:nowrap}
  .student .topic{color:var(--muted);font-size:.93rem;margin-top:6px}

  .timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:24px}
  .tl{position:relative;padding:0 0 18px}
  .tl::before{content:"";position:absolute;left:-31px;top:7px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
  .tl .y{font-weight:700;color:var(--navy2);font-size:.9rem}
  .tl .t{color:var(--ink)}
  .tl .t small{color:var(--muted)}

  .pubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .pub{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-weight:600;transition:.2s}
  .pub:hover{border-color:var(--teal);color:var(--navy);box-shadow:0 8px 20px rgba(31,181,201,.15)}
  .pub::after{content:"→";color:var(--teal)}
  .paper{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
  .paper:last-child{border-bottom:0}
  .py{font-weight:700;color:#fff;background:var(--navy2);border-radius:8px;padding:2px 10px;height:fit-content;font-size:.85rem}
  .venue{color:var(--teal);font-weight:600;font-size:.88rem;margin-top:2px;font-style:italic}
  .journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .step{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:18px 20px}
  .step .y{color:var(--teal);font-weight:700;font-size:.85rem}
  .step p{margin:6px 0 0;color:rgba(255,255,255,.8);font-size:.92rem}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

  footer{margin-top:90px;background:var(--navy);color:rgba(255,255,255,.75);padding:40px 0;font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  footer a{color:#fff}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:760px){
    nav{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;gap:0;background:var(--navy)}
    nav.open{display:flex} nav a{padding:14px 24px;border-top:1px solid rgba(255,255,255,.08)} nav a.on::after{display:none}
    .burger{display:block}
    .about,.two{grid-template-columns:1fr}
    .hero{padding:120px 0 120px}
  }

  nav{gap:20px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .lab{display:block;color:var(--ink);font-weight:600;font-size:.92rem}
  .stat small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px;line-height:1.4}
  .stats.mini{margin-top:0;grid-template-columns:repeat(4,1fr)}
  .stats.mini .stat{box-shadow:none;border:1px solid var(--line)}
  .pt{display:block;font-weight:600}
  .d{display:block;color:var(--muted)}
  .fw{color:var(--navy2);font-size:.82rem;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .now{display:inline-block;background:var(--teal-soft);color:#0b6673;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:600;margin-top:2px}
  .lead{font-size:1.05rem;color:var(--muted);max-width:820px}
  .tablewrap{overflow-x:auto;padding:12px 18px}
  table.grants{width:100%;border-collapse:collapse;font-size:.9rem}
  table.grants th{text-align:left;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:2px solid var(--line)}
  table.grants td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.grants tr:hover td{background:#f8fbfd}
  .nw{white-space:nowrap}
  .role-lead{background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:.78rem;white-space:nowrap}
  .role-part{background:#eef1f5;color:var(--muted);border-radius:6px;padding:1px 8px;font-size:.78rem;white-space:nowrap}
  @media (max-width:900px){ nav{gap:14px} nav a{font-size:.85rem} .stats{grid-template-columns:repeat(2,1fr)} .stats.mini{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ nav{gap:0} }
</style>
</head>

<header id="hdr"><div class="wrap bar">

<main class="wrap" id="main"></main>
<footer><div class="wrap" id="footer"></div></footer>

<script>
/* Page builder — no need to edit below this line. */
const S = SITE;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = u => `href="${esc(u)}" target="_blank" rel="noopener"`;
const has = a => Array.isArray(a) && a.length;
const card = (title, inner, extra="") => `<div class="card ${extra}">${title?`<b>${title}</b>`:""}${inner}</div>`;
const tl = rows => `<div class="timeline" style="margin-top:14px">${rows.map(r=>`
  <div class="tl"><div class="y">${esc(r[0])}</div><div class="t">${r[1]}</div></div>`).join("")}</div>`;
const list = a => `<ul class="teams">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

// Logos: try local file, then official online image, then show the name as text
const logoImg = l => `<img src="${esc(l.file || l.online)}" alt="${esc(l.name)}" data-online="${esc(l.online||"")}" data-name="${esc(l.name)}"
  onerror="if(this.dataset.online && this.src!==this.dataset.online){this.src=this.dataset.online}else{this.outerHTML='<span class=wordmark>'+this.dataset.name+'</span>'}">`;
document.getElementById("brand").innerHTML = `${S.logos[0] ? logoImg(S.logos[0]) : ""}<span>${esc(S.name)}</span>`;

// Hero
document.getElementById("hero").innerHTML = `
  <h1>${esc(S.prefix)} ${esc(S.name)}</h1>
  <div class="role">${esc(S.title)}</div>
  <div class="aff">${S.affiliations.map(esc).join("<br>")}</div>
  <div class="btns">
    <a class="btn main" href="mailto:${esc(S.email)}">✉ ${esc(S.email)}</a>
    ${S.links.map(l => `<a class="btn" ${ext(l.url)}>${esc(l.label)}</a>`).join("")}
  </div>`;

let html = "";
if (has(S.stats)) html += `<div class="stats reveal">${S.stats.map(s => `<div class="stat"><b>${esc(s[0])}</b><span class="lab">${esc(s[1])}</span>${s[2]?`<small>${esc(s[2])}</small>`:""}</div>`).join("")}</div>`;
if (has(S.logos)) html += `<div class="partners reveal">${S.logos.map(l => `<a class="partner" ${ext(l.site)} title="${esc(l.name)}">${logoImg(l)}</a>`).join("")}</div>`;

const sec = [];
sec.push(["about","About","Profile",`
  <div class="about">
    ${card("", S.profile.map(p=>`<p>${esc(p)}</p>`).join("") + `<div class="tags" style="margin-top:16px">${S.keywords.map(k=>`<span>${esc(k)}</span>`).join("")}</div>`)}
    ${card("Degrees", tl(S.degrees.map(d=>[`${d[0]} · ${d[1]}`, `${esc(d[2])}${d[3]?` <a ${ext(d[3])}>(pdf)</a>`:""}`])))}
  </div>`]);

sec.push(["positions","Positions","Career",`
  <div class="two">
    ${card("Current positions", tl(S.currentPositions.map(p=>[p[0], `<b class="pt">${esc(p[1])}</b>${p[2]?`<small class="d">${esc(p[2])}</small>`:""}`])))}
    ${card("Past positions", tl(S.pastPositions.map(p=>[p[0], `<b class="pt">${esc(p[1])}</b>${p[2]?`<small class="d">${esc(p[2])}</small>`:""}`])))}
  </div>`]);

sec.push(["research","Research","Topics & funding",`
  <div class="journey">${S.topics.map(t=>`<div class="step reveal"><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>`).join("")}</div>
  ${has(S.grants)?`<h3>Research grants obtained</h3><div class="card tablewrap"><table class="grants">
    <tr><th>Project</th><th>Funding</th><th>Amount</th><th>Period</th><th>Role</th><th>Topic</th></tr>

  </table></div>`:""}
  ${has(S.international)?`<h3>International cooperation</h3><div class="grid">${S.international.map(i=>`<div class="student reveal"><b>${esc(i[0])}</b><div class="topic">${esc(i[1])}</div></div>`).join("")}</div>`:""}`]);

sec.push(["students","Students","Supervision",`
  ${S.supervisionSummary?`<p class="lead">${esc(S.supervisionSummary)}</p>`:""}
  ${has(S.currentStudents)?`<h3>Ongoing PhD theses</h3><div class="grid">${S.currentStudents.map(s=>`
    <div class="student reveal"><div class="top"><b>${esc(s[1])}</b><span class="badge">since ${esc(s[0])}</span></div>
    <div class="topic">${esc(s[2])}</div>${s[3]?`<div class="fw">${esc(s[3])}</div>`:""}</div>`).join("")}</div>`:""}
  ${has(S.formerStudents)?`<h3>Defended PhD theses</h3>${card("", tl(S.formerStudents.map(s=>[s[0],
    `${esc(s[1])} <small>— ${esc(s[2])}${s[3]?` · ${esc(s[3])}`:""}</small>${s[4]?` <span class="now">→ ${esc(s[4])}</span>`:""}`])))}`:""}
  ${has(S.postdocs)?`<h3>Post-docs</h3>${card("", tl(S.postdocs.map(s=>[s[0],
    `${esc(s[1])} <small>— ${esc(s[2])}</small>${s[3]?` <span class="now">→ ${esc(s[3])}</span>`:""}`])))}`:""}`]);

const P = S.publications;
sec.push(["publications","Publications","Research output",`
  ${has(P.counts)?`<div class="stats mini">${P.counts.map(c=>`<div class="stat"><b>${esc(c[0])}</b><span class="lab">${esc(c[1])}</span></div>`).join("")}</div>`:""}
  <div class="pubs" style="margin-top:16px">${P.links.map(l=>`<a class="pub" ${ext(l.url)}>${esc(l.label)}</a>`).join("")}</div>
  ${has(P.selected)?`<h3>Selected publications</h3><div class="card sel">${P.selected.map(p=>`
    <div class="paper"><span class="py">${esc(p.year||"")}</span><div>${p.url&&p.url!=="#"?`<a ${ext(p.url)}>${esc(p.text)}</a>`:esc(p.text)}
    ${p.venue?`<div class="venue">${esc(p.venue)}</div>`:""}</div></div>`).join("")}</div>`:""}
  ${has(P.talks)?`<h3>Invited and plenary talks</h3>${card("", tl(P.talks.map(t=>[t[0], `${esc(t[1])} <small>— ${esc(t[2])}</small>`])))}`:""}`]);

sec.push(["teaching","Teaching","Education",`
  <div class="two">
    ${card("Current responsibilities (ENSTA)", list(S.teachingCurrent))}
    ${card("Past responsibilities", list(S.teachingPast))}
  </div>`]);

sec.push(["service","Service","Scientific community",`
  <div class="two">
    ${card("Committees, networks and expertise", list(S.service))}
    ${card("PhD & HDR committees (24)", tl(S.committees.map(c=>[c[0], esc(c[1])])))}
  </div>`]);

html += sec.map(s=>`<section id="${s[0]}" class="reveal"><div class="kicker">${s[2]}</div><h2>${s[1]}</h2>${s[3]}</section>`).join("");
document.getElementById("main").innerHTML = html;
document.getElementById("nav").innerHTML = sec.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join("");
document.getElementById("footer").innerHTML =
  `<span>© ${esc(S.prefix)} ${esc(S.name)} · ENSTA – Institut Polytechnique de Paris</span><span>Last updated: ${esc(S.lastUpdate)}</span>`;
document.title = `${S.prefix} ${S.name}`;

// Effects: solid header on scroll, active menu item, fade-in, mobile menu
const hdr = document.getElementById("hdr"), nav = document.getElementById("nav");
addEventListener("scroll", () => {
  hdr.classList.toggle("solid", scrollY > 40);
  let cur = ""; sec.forEach(s => { const el = document.getElementById(s[0]); if (el.getBoundingClientRect().top < 140) cur = s[0]; });
  nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
});
document.getElementById("burger").onclick = () => nav.classList.toggle("open");
nav.onclick = () => nav.classList.remove("open");
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.05}) : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));
</script>
